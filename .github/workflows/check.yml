name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: sh -n install.sh scripts/release.sh
      - run: bun run check
      - run: bun audit
      - run: bun run build
      - run: bunx --no-install playwright-core install --with-deps chromium
      - run: bun run e2e
      - run: bun run release
